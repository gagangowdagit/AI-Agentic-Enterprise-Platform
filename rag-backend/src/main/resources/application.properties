spring.application.name=rag-backend
spring.config.import=optional:file:./.env[.properties]

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/rag_db
spring.datasource.username=postgres
spring.datasource.password=root

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-lifetime=${JWT_ACCESS_TOKEN_LIFETIME:PT15M}

ollama.api.url=${OLLAMA_API_URL:http://localhost:11434}
ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
ollama.llm.model=${OLLAMA_LLM_MODEL:llama3.2:3b}